<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>drone delivery</title>
  <script src="temp.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
</head>

<body>
  <h1>
    Keng's
  </h1>

  <div id="map" style="width: 100%; height: 500px"></div>
  <pre id="coords" class="coords"></pre>

  <div id="destination">
    <div>
      <br>
      <label for="lat">latitude</label>
      <br>
      <input type="number" id="lat" name="latitude" value="-75.189" />
    </div>

    <div>
      <br>
      <label for="lon">longitude</label>
      <br>
      <input type="number" id="lon" name="lon" value="40.686" />
    </div>

    <button id="submit" onclick="update_location()">go</button>
  </div>

  <script>
    var lat = document.getElementById("lat").valueAsNumber;
    var lon = document.getElementById("lon").valueAsNumber;
    var coordinates = new Module.Coordinates();
    var pilot = new Module.Pilot();

    coordinates.set_destination(lat, lon);


    const coords = document.getElementById("coords");

    coords.innerHTML =
      `Longitude: ${coordinates.get_longitude()}<br/>Latitude: ${coordinates.get_latitude()}`;

    var map = new maplibregl.Map({
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [coordinates.get_latitude(), coordinates.get_longitude()],
      zoom: 9.5,
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap Contributors',
            maxzoom: 19
          },

          terrainSource: {
            type: 'raster-dem',
            url: 'https://tiles.mapterhorn.com/tilejson.json'
          },
          hillshadeSource: {
            type: 'raster-dem',
            url: 'https://tiles.mapterhorn.com/tilejson.json'
          }
        },
        layers: [
          {
            id: 'osm',
            type: 'raster',
            source: 'osm'
          },
          {
            id: 'hills',
            type: 'hillshade',
            source: 'hillshadeSource',
            layout: {visibility: 'visible'},
            paint: {'hillshade-shadow-color': '#473B24'}
          }
        ],
        terrain: {
          source: 'terrainSource',
          exaggeration: 1
        },
        sky: {}
      },
    })

    map.addControl(
      new maplibregl.NavigationControl({
        visualizePitch: true,
        showZoom: true,
        showCompass: true
      })
    );

    map.addControl(
      new maplibregl.TerrainControl({
        source: 'terrainSource',
        exaggeration: 1
      })
    );

    let marker = new maplibregl.Marker({draggable: true})
      .setLngLat([lat, lon])
      .addTo(map);
    // Coords flipped somewhere
    function onDragEnd() {
      lng_lat = marker.getLngLat();
      coordinates.set_destination(lng_lat.lat, lng_lat.lng);
      coords.style.display = 'block';
      coords.innerHTML =
        `Longitude: ${coordinates.get_longitude()}<br/>Latitude: ${coordinates.get_latitude()}`;
    }

    marker.on('dragend', onDragEnd);

    function update_location() {
      lat = document.getElementById("lat").valueAsNumber;
      lng = document.getElementById("lon").valueAsNumber;

      coordinates.set_destination(lat, lng);
      coords.style.display = 'block';
      coords.innerHTML =
        `Longitude: ${coordinates.get_longitude()}<br/>Latitude: ${coordinates.get_latitude()}`;


      map.center = [coordinates.get_latitude(), coordinates.get_longitude()];
      map.resize();
      window.location.reload()
      console.log("latitude- ", lat);
      console.log("longitude-", lon);
    }

  </script>

</body>

</html>
